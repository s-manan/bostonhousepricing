# Workflow name
name: Deploy to AWS App Runner

# Trigger: Run this workflow on every push to the main branch
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Configure AWS credentials using GitHub Secrets
      # You need to add these 3 secrets in your GitHub repo settings:
      #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Step 3: Log in to Amazon ECR (Elastic Container Registry)
      # ECR is where your Docker image will be stored (like DockerHub but on AWS)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Step 4: Build the Docker image, tag it, and push it to ECR
      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: boston-house-pricing        # Name of your ECR repository
          IMAGE_TAG: ${{ github.sha }}                # Unique tag using git commit hash
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Step 5: Deploy the pushed image to AWS App Runner
      # App Runner will pull the image from ECR and run it automatically
      - name: Deploy to AWS App Runner
        uses: awslabs/amazon-app-runner-deploy@main
        with:
          service: boston-house-pricing-service      # Name of your App Runner service
          image: ${{ steps.login-ecr.outputs.registry }}/boston-house-pricing:${{ github.sha }}
          access-role-arn: ${{ secrets.APP_RUNNER_ROLE_ARN }}  # IAM role that allows App Runner to pull from ECR
          region: us-east-1
          port: 8080                                 # Must match the port exposed in the Dockerfile
          wait-for-service-stability: true           # Wait until deployment is fully live before marking success